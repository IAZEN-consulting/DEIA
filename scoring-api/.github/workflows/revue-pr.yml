# Le nom exact de l'action d'agent evolue vite : verifier la doc avant de copier.
name: Revue automatique des PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Tests
        run: uv sync && uv run pytest

      - name: Revue de securite
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: /revue-securite
